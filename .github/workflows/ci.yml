name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Dummy values: the unit suite mocks the database and external services, so
    # no real secrets are needed — these just satisfy module-load-time env checks.
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
      DIRECT_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
      AUTH_SECRET: ci-dummy-secret
      AUTH_GOOGLE_ID: ci-dummy
      AUTH_GOOGLE_SECRET: ci-dummy
      GOOGLE_GENERATIVE_AI_API_KEY: ci-dummy
      TRIGGER_SECRET_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4

      # This repo uses pnpm (pnpm-lock.yaml, no npm lockfile). Install pnpm
      # BEFORE setup-node so setup-node's pnpm cache can resolve the store path.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test
