name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Dummy values: the unit suite mocks the database and external services, so
    # no real secrets are needed — these just satisfy module-load-time env checks.
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
      DIRECT_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
      AUTH_SECRET: ci-dummy-secret
      AUTH_GOOGLE_ID: ci-dummy
      AUTH_GOOGLE_SECRET: ci-dummy
      GOOGLE_GENERATIVE_AI_API_KEY: ci-dummy
      TRIGGER_SECRET_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
